<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geschenk-Jahresstatistik · Toolya Wishes</title>
<style>:root{font:16px system-ui,sans-serif;color:#302b40;background:#f7f5fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:20px 16px 65px}a{color:#5941a7}section{background:#fff;border:1px solid #e5ddec;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:clamp(1.6rem,4vw,2.4rem)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.item,.row,.week-day{border:1px solid #ddd2e8;border-radius:10px;padding:12px;margin:8px 0}.controls,.actions{display:flex;flex-wrap:wrap;gap:8px}input,select,textarea,button{font:inherit;max-width:100%;padding:10px;border:1px solid #b7a6d0;border-radius:8px}label{display:block;margin:10px 0}button{background:#5941a7;color:white;cursor:pointer}button:disabled{opacity:.5}.warn{background:#fff1d7;padding:10px}.empty{color:#665d70}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week-day{overflow-wrap:anywhere}.task-chip{display:block}.table-wrap{overflow-x:auto}table{border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}@media(max-width:700px){.week-grid{grid-template-columns:repeat(2,1fr)}}@media(prefers-color-scheme:dark){:root{background:#211d2c;color:#f1eefa}header,section{background:#30293e;border-color:#5b4b6d}a{color:#cdb9ff}}</style>

<body><header><a href="./index.html">← Wünsche</a></header><main><h1>Geschenk-Jahresstatistik</h1><p id="status" role="status" aria-live="polite">Lade private Daten …</p><section id="login" hidden>Bitte <a href="./index.html">anmelden</a>.</section><div id="content" hidden><section><label>Auswertungsjahr <select id="year"></select></label><div class="grid"><div>Geschenke <strong id="gifts"></strong></div><div>Abgeschlossen <strong id="completion"></strong></div><div>Ausgaben <strong id="spent"></strong></div><div>Budget <strong id="budget"></strong></div></div><div id="comparison"></div><div id="budgetDetails"></div><div id="completed"></div></section>
<section><h2>Geschenkjahre bearbeiten</h2><div id="giftYearEditor"></div></section>
<section><h2>Erkenntnisse</h2><div id="insightsSummary"></div><div id="insightsTrends"></div><div id="insightsBudgets"></div><div id="insightsOccasions"></div><div id="insightsRecommendations"></div></section>
