<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>:root{font:16px system-ui,sans-serif;color:#302b40;background:#f7f5fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:20px 16px 65px}a{color:#5941a7}section{background:#fff;border:1px solid #e5ddec;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:clamp(1.6rem,4vw,2.4rem)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.item,.row,.week-day{border:1px solid #ddd2e8;border-radius:10px;padding:12px;margin:8px 0}.controls,.actions{display:flex;flex-wrap:wrap;gap:8px}input,select,textarea,button{font:inherit;max-width:100%;padding:10px;border:1px solid #b7a6d0;border-radius:8px}label{display:block;margin:10px 0}button{background:#5941a7;color:white;cursor:pointer}button:disabled{opacity:.5}.warn{background:#fff1d7;padding:10px}.empty{color:#665d70}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week-day{overflow-wrap:anywhere}.task-chip{display:block}.table-wrap{overflow-x:auto}table{border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}@media(max-width:700px){.week-grid{grid-template-columns:repeat(2,1fr)}}@media(prefers-color-scheme:dark){:root{background:#211d2c;color:#f1eefa}header,section{background:#30293e;border-color:#5b4b6d}a{color:#cdb9ff}}</style>
<script defer src="../../assets/helferlein-dialogs.js"></script></head>
<body><header><a href="./index.html">← Wünsche</a></header><main><h1>Geschenkaufgaben</h1><p id="status" role="status" aria-live="polite">Lade private Daten …</p><section id="login" hidden>Bitte <a href="./index.html">anmelden</a>.</section><div id="content" hidden><section><h2>Aufgabe bearbeiten</h2><form id="form"><h3 id="formTitle">➕ Aufgabe hinzufügen</h3><label>Aufgabe <input id="title" required maxlength="250"></label><label>Anlass <select id="occasion"></select></label><label>Geschenk <select id="gift"></select></label><label>Fällig am <input id="due" type="date"></label><button type="button" id="suggestDue">Anlassdatum übernehmen</button><p id="dueHint"></p><label>Erinnerung (Tage vorher) <input id="reminder" type="number" min="0" max="365" value="3"></label><label>Priorität <select id="priority"><option value="1">Hoch</option><option value="2" selected>Mittel</option><option value="3">Niedrig</option></select></label><label>Status <select id="taskStatus"><option value="open">Offen</option><option value="in_progress">In Arbeit</option><option value="done">Erledigt</option></select></label><label>Notizen <textarea id="notes"></textarea></label><div class="actions"><button id="save" type="submit">Aufgabe speichern</button><button id="cancel" type="button" hidden>Abbrechen</button></div></form><h3>Vorlagen</h3><div id="templates" class="actions"></div><p id="templateHint"></p></section>
<section><h2>Erinnerungen</h2><div id="reminders"></div></section><section><h2>Aufgaben</h2><label>Filter <select id="filter"><option value="all">Alle</option><option value="open">Offen</option><option value="done">Erledigt</option></select></label><div id="tasks"></div></section>
<section><h2>Wochenplanung</h2><div class="actions"><button id="weekPrev" type="button">←</button><button id="weekToday" type="button">Heute</button><button id="weekNext" type="button">→</button></div><h3 id="weekLabel"></h3><div id="weekGrid" class="week-grid"></div></section>
<section><h2>Jahres-Checklisten</h2><label>Anlass <select id="checklistOccasion"><option value="">Bitte auswählen</option></select></label><label>Jahr <select id="checklistYear"></select></label><div class="actions"><button type="button" data-checklist="standard">Standardpaket</button><button type="button" data-checklist="last_minute">Kurzfristig</button><button type="button" data-checklist="shipping">Versand</button><button id="archiveYear" type="button">Archivieren</button><button id="restoreYear" type="button">Wiederherstellen</button></div><p id="checklistStatus" role="status"></p><div id="checklistProgress"></div><h3>Jahresbilanz</h3><div id="yearBalance"></div><h3>Vorjahresaufgaben übernehmen</h3><div id="rolloverSelection"></div><button id="rolloverCreate" type="button">Auswahl übernehmen</button><p id="rolloverStatus" role="status"></p></section></div></main>
