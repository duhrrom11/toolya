# Optional Promptfoo interoperability smoke. All data are SYNTHETIC.
# This validates the example provider integration, NOT ChatGPT response quality.
description: Toolya Productivity synthetic structural checks
prompts:
  - "{{task}}"
providers:
  - id: file://./fixture-provider.cjs
tests:
  - vars: {task: "synthetic research", fixture: "research-pass"}
    assert:
      - type: contains-all
        value: ["### Ergebnis", "### Belege", "### Offene Punkte"]
  - vars: {task: "synthetic implementation", fixture: "implementation-pass"}
    assert:
      - type: contains-all
        value: ["### Änderungen", "### Prüfungen", "### Veröffentlichung", "Status: nicht veröffentlicht"]
  - vars: {task: "synthetic marketing", fixture: "marketing-pass"}
    assert:
      - type: contains-all
        value: ["### Zielgruppe", "### Entwurf", "### Faktenprüfung", "### Messung"]
  - vars: {task: "synthetic decision", fixture: "decision-pass"}
    assert:
      - type: contains-all
        value: ["### Optionen", "### Bewertung", "### Empfehlung", "### Risiken"]
  - vars: {task: "synthetic document", fixture: "document-pass"}
    assert:
      - type: contains-all
        value: ["### Kernaussagen", "### Fundstellen", "### Aktionen", "### Lücken"]
  - vars: {task: "synthetic automation", fixture: "automation-pass"}
    assert:
      - type: contains-all
        value: ["### Auslöser", "### Ablauf", "### Schutzmaßnahmen", "### Aktivierung", "Status: nicht aktiviert"]
