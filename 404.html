<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Seite nicht gefunden | Toolya</title>
  <link rel="stylesheet" href="/parkplatz-merker/guide.css">
</head>
<body>
  <header><a class="brand" href="/">Toolya</a></header>
  <main>
    <section class="intro" id="ty-message-de" lang="de">
      <div>
        <h1>Diese Seite wurde nicht gefunden</h1>
        <p>Hier findest du die aktuellen Tools und Anleitungen.</p>
        <p><a class="button" href="/#toolDiscovery">Zu den Tools</a></p>
        <a href="/#anleitungen">Zu den Anleitungen</a>
      </div>
    </section>
<section class="intro" id="ty-message-en" lang="en" hidden><div>
<h1>We couldn't find this page</h1>
<p>Explore the latest Toolya tools and guides in English.</p>
<p><a class="button" href="/en/">English Toolya homepage</a></p>
<a href="/en/#tools">Explore all tools</a>
</div></section>
  </main>
<script>
(()=>{let chosen='de';try{if(location.pathname.startsWith('/en/')||localStorage.getItem('toolya-locale-v1')==='en')chosen='en'}catch{}
document.documentElement.lang=chosen;document.title=(chosen==='en'?'Page not found':'Seite nicht gefunden')+' | Toolya';
for(const lang of ['de','en'])document.getElementById('ty-message-'+lang).hidden=lang!==chosen;
})();
</script></body>
</html>
