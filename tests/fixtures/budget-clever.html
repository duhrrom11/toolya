<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/tools/budget/clever.css">
</head><body style="padding:12px;background:#f7faf7;font-family:system-ui,Arial,sans-serif">
<main><section id="cs-root"></section>
<div class="p-4" style="max-width:900px;margin:auto;padding:15px;background:#fff">
<input type="file" id="receiptPhotoInput" accept="image/*"></div></main>
<script>
(function(){
 const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const now=new Date(),last=new Date(now.getFullYear(),now.getMonth()-1,8),dayBefore=new Date(now.getFullYear(),now.getMonth(),now.getDate()-2);
 let snapshot={entries:[
  {id:1,date:iso(last),title:'Einkauf',price:6.8,category:'Lebensmittel',store:'Markt A',lineItems:[{name:'Butter 250g',quantity:1,unit:'Stück',total:1.79},{name:'Milch',quantity:2,unit:'Stück',total:5.01}]},
  {id:2,date:iso(dayBefore),title:'Einkauf',price:7.8,category:'Lebensmittel',store:'Markt B',lineItems:[{name:'Butter 250g',quantity:1,unit:'Stück',total:2.29},{name:'Milch',quantity:2,unit:'Stück',total:5.51}]},
  {id:3,date:iso(dayBefore),title:'Einkauf',price:7.8,category:'Lebensmittel',store:'Markt B',lineItems:[{name:'Butter 250g',quantity:1,unit:'Stück',total:2.29},{name:'Milch',quantity:2,unit:'Stück',total:5.51}]},
  {id:4,date:iso(dayBefore),title:'Gehalt',price:900,entryType:'einnahme',category:'Einnahme'}
 ],budgets:{},goals:[],cleverSparen:{weeklyBudget:200,shopping:[],annual:[],meals:[],repairs:[]}};
 window.__fixture={get:()=>JSON.parse(JSON.stringify(snapshot))};
 window.toolyaCleverBudget={snapshot:()=>JSON.parse(JSON.stringify(snapshot)),save:async patch=>{snapshot={...snapshot,...JSON.parse(JSON.stringify(patch))};return true}};
})();
</script>
<script defer src="/tools/budget/clever-core.js"></script>
<script defer src="/tools/budget/clever-ui.js"></script>
</body></html>
