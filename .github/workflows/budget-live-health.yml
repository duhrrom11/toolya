name: Toolya Haushaltsbuch – Live-Veröffentlichung prüfen

on:
  pull_request:
    paths:
      - "tools/budget/**"
      - "tests/budget-live-health.cjs"
      - ".github/workflows/budget-live-health.yml"
  push:
    branches: [main]
    paths:
      - "tools/budget/**"
      - "tests/budget-live-health.cjs"
      - ".github/workflows/budget-live-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    name: Echtes Haushaltsbuch online prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Öffentliches Haushaltsbuch und Assets vergleichen
        run: node tests/budget-live-health.cjs
        env:
          TOOLYA_LIVE_RETRIES: "10"
          TOOLYA_LIVE_RETRY_DELAY_MS: "12000"
