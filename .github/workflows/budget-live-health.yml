name: Toolya Haushaltsbuch – Live-Veröffentlichung prüfen

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "tools/budget/**"
      - "tests/budget-live-health.cjs"
      - ".github/workflows/budget-live-health.yml"
  push:
    branches: [main]
    paths:
      - "tools/budget/**"
      - "tests/budget-live-health.cjs"
      - ".github/workflows/budget-live-health.yml"
  workflow_dispatch:

concurrency:
  group: budget-live-health-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  live-health:
    name: Echtes Haushaltsbuch online prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Referenz für die produktive Auslieferung laden
        uses: actions/checkout@v4
        with:
          # PR code is tested by Budget Clever sparen – Checks. Compare the
          # public site against the base revision while the PR is unreleased.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Öffentliches Haushaltsbuch und Assets vergleichen
        run: node tests/budget-live-health.cjs
        env:
          TOOLYA_LIVE_RETRIES: "10"
          TOOLYA_LIVE_RETRY_DELAY_MS: "12000"
