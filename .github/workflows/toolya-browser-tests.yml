name: Isolated Toolya browser tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/toolya-browser-tests.yml'
      - 'tests/browser/**'
      - 'shared/toolya/**'
  push:
    branches:
      - main
      - feature/toolya-connect-phase-b
      - feature/i18n-de-en-foundation-20261121
    paths:
      - '.github/workflows/toolya-browser-tests.yml'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - 'scripts/home-preview.cjs'
      - 'tools/car/**'
      - 'tools/budget/**'
      - 'tools/moving/**'
      - 'tools/loans/**'
      - 'tools/meters/**'
      - 'tools/plants/**'
      - 'tools/parking/**'
      - 'tools/pet-health/**'
      - 'tools/baking/**'
      - 'tools/wishes/**'
      - 'tools/estate/**'
      - 'shared/toolya/**'
      - 'assets/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolya-browser-tests.yml-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  isolated-browser-tests:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'release/toolya-english-1.0' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch the startup comparison baseline
        run: git fetch --no-tags --depth=1 origin eb1ed8a09831603aaaeb8ffe4c34d0f98716d4ab
      - name: Run isolated Toolya cloud-only UI tests
        env:
          TOOLYA_STARTUP_COMPARISON: '1'
          TOOLYA_VISUAL_LOGS: ${{ github.event.pull_request.draft && '1' || '0' }}
        run: npx playwright test tests/browser/tool-pages-ui.spec.cjs tests/browser/cloud-isolated.spec.cjs --reporter=line
      - name: Upload isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolya-browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
