name: Moving Planner release checks
on:
  push:
    branches:
      - feature/moving-planner-release1-20261121
  pull_request:
    paths:
      - 'tools/moving/**'
      - 'shared/toolya/cloud-controller.mjs'
      - 'tests/moving-model.test.mjs'
      - '.github/workflows/moving-planner.yml'
  workflow_dispatch:
jobs:
  moving-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/moving-model.test.mjs tests/cloud-moving.test.mjs tests/cloud-controller.test.mjs tests/cloud-repository.test.mjs
      - run: node --check tools/moving/moving-state.mjs
      - run: node --check tools/moving/moving-ui.mjs
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/moving-ui.spec.cjs --config=playwright.config.cjs
