name: Budget Clever sparen – Checks
on:
  pull_request:
    paths:
      - "tools/budget/**"
      - "tests/budget-clever.test.mjs"
      - "tests/budget-clever-browser.cjs"
      - "tests/fixtures/budget-clever.html"
      - ".github/workflows/budget-clever.yml"
  push:
    branches: [main]
    paths:
      - "tools/budget/**"
      - "tests/budget-clever.test.mjs"
      - "tests/budget-clever-browser.cjs"
      - "tests/fixtures/budget-clever.html"
      - ".github/workflows/budget-clever.yml"

permissions:
  contents: read

jobs:
  budget-clever:
    name: Preis-, Budget- und OCR-Berechnungen
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Tests ausführen
        run: node --test tests/budget-clever.test.mjs
      - name: Browser-JavaScript Syntax prüfen
        run: |
          node --check tools/budget/clever-core.js
          node --check tools/budget/clever-ui.js

  budget-browser:
    name: Clever sparen – Handy und Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Oberfläche im Browser prüfen
        run: node tests/budget-clever-browser.cjs
      - name: Screenshots zur visuellen Prüfung sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clever-sparen-desktop-mobil
          path: tmp/budget-clever-checks/*.png
          if-no-files-found: ignore
