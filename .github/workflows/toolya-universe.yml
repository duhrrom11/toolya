name: Toolya Universe isolated checks
on:
  pull_request:
    paths:
      - '.github/workflows/toolya-universe.yml'
      - 'account/**'
      - 'assets/toolya/universe/**'
      - 'scripts/universe-preview.cjs'
      - 'shared/toolya/**'
      - 'supabase/migrations/*_toolya_universe.sql'
      - 'tests/universe/**'
      - 'tools/**'
      - 'index.html'
  push:
    branches: [feature/gamification-mascot-levels-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: universe
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: universe_fixture
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U universe -d universe_fixture" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: universe
      PGPASSWORD: isolated-only
      PGDATABASE: universe_fixture
      UNIVERSE_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify migration reapplication and account isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/universe/fixture.sql
          psql -v ON_ERROR_STOP=1 -f tests/universe/tool-fixture.sql
          for run in 1 2; do
            psql -v ON_ERROR_STOP=1 -f "$(find supabase/migrations -name '*_toolya_universe.sql')"
          done
          psql -v ON_ERROR_STOP=1 -f tests/universe/verify.sql
      - name: Verify account creation, local email and data API with real GoTrue and PostgREST
        env:
          UNIVERSE_AUTH_TEST_DB: postgres://universe:isolated-only@127.0.0.1:5432/universe_auth_fixture
          UNIVERSE_GOTRUE: /tmp/universe-gotrue
          UNIVERSE_POSTGREST: /tmp/universe-postgrest/postgrest
        run: |
          auth_image=supabase/gotrue@sha256:d27676aa4d70689de720f0f73e29edd2383267473003e2944576a323efdad1c8
          docker pull "$auth_image"
          auth_container=$(docker create "$auth_image")
          trap 'docker rm "$auth_container"' EXIT
          docker cp "$auth_container:/usr/local/bin/auth" "$UNIVERSE_GOTRUE"
          chmod +x "$UNIVERSE_GOTRUE"
          mkdir -p /tmp/universe-postgrest
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/PostgREST/postgrest/releases/download/v14.8/postgrest-v14.8-linux-static-x86-64.tar.xz \
            --output /tmp/universe-postgrest.tar.xz
          printf '%s\n' '172a55aebcee6d7be2c3ea16476fca69a215afcd68d3d1849b7555878909f0b0  /tmp/universe-postgrest.tar.xz' | sha256sum --check
          tar -xf /tmp/universe-postgrest.tar.xz -C /tmp/universe-postgrest
          createdb universe_auth_fixture
          node tests/universe/auth.cjs
      - name: Verify original mascots
        working-directory: assets/toolya/originals
        run: sha256sum --check SHA256SUMS
      - name: Verify the isolated preview blocks existing backends
        run: node --test tests/universe/preview.test.cjs
      - name: Test signed-in and signed-out Universe and registration
        run: node tests/universe/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-browser-evidence
          path: test-results/universe-*.png
          if-no-files-found: ignore
