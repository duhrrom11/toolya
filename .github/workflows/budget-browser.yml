name: Budget isolated browser regression
on:
  pull_request:
  push:
    branches: [main, feature/budget-full-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/budget/budget-playwright.cjs
