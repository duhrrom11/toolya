name: Budget strict i18n candidate
on:
  push:
    branches: [feature/budget-full-release]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  strict-candidate:
    if: github.head_ref == 'feature/budget-full-release' || github.ref_name == 'feature/budget-full-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/i18n-coverage-audit.mjs --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-strict-international-coverage
          path: |
            i18n-coverage-report.md
            i18n-coverage-report.json
