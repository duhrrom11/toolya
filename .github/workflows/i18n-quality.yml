name: Toolya DE-EN translation quality
on:
  pull_request:
    paths:
      - 'docs/i18n/**'
      - 'shared/toolya/i18n/**'
      - 'tools/**'
      - 'en/**'
      - 'dashboard/**'
      - 'tests/i18n/**'
      - 'scripts/i18n-quality.cjs'
      - 'package.json'
      - '.github/workflows/i18n-quality.yml'
  push:
    branches: [main]
    paths:
      - 'docs/i18n/**'
      - 'shared/toolya/i18n/**'
      - 'tools/**'
      - 'en/**'
      - 'dashboard/**'
      - 'tests/i18n/**'
      - 'scripts/i18n-quality.cjs'
      - 'package.json'
      - '.github/workflows/i18n-quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install existing local dependencies
        run: npm ci --ignore-scripts
      - name: Validate audit and browser test syntax
        run: |
          node --check scripts/i18n-quality.cjs
          node --check tests/i18n/quality-browser.cjs
          node --check tests/i18n/wishes-editorial-browser.cjs
      - name: Check existing and new DE/EN translations offline
        run: |
          npm run test:i18n
          npm run i18n:check
      - name: Generate review-only DE/EN inventory and JSON exports
        run: npm run i18n:report
      - name: Inspect language choices and mobile layout in local Chromium
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/i18n/quality-browser.cjs
          node tests/i18n/wishes-editorial-browser.cjs
          node tests/i18n/application-shell-browser.cjs
      - name: Upload translation audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolya-de-en-quality-report
          path: test-results/i18n-quality/
          retention-days: 14
          if-no-files-found: warn
