name: Cloud-only isolated tests
on:
  push:
    branches:
      - feature/toolya-connect-phase-b
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cloud-controller.test.mjs tests/cloud-backup.test.mjs tests/cloud-repository.test.mjs tests/cloud-migration.test.mjs tests/cloud-rpc-contract.test.mjs tests/cloud-auth-gate.test.mjs
