name: Toolya Connect due tasks
on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'shared/toolya/connect-due-sources.mjs'
      - 'tests/connect-due-sources.test.mjs'
      - '.github/workflows/connect-due-tasks.yml'
  push:
    branches:
      - feature/connect-deadlines-and-returns
      - main
    paths:
      - 'dashboard/**'
      - 'shared/toolya/connect-due-sources.mjs'
      - 'tests/connect-due-sources.test.mjs'
      - '.github/workflows/connect-due-tasks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and isolated provider tests
        run: |
          node --input-type=module --check < dashboard/dashboard.js
          node --check dashboard/modules/unified-shopping.mjs
          node --check shared/toolya/connect-due-sources.mjs
          node --test tests/connect-due-sources.test.mjs tests/connect-shopping.test.mjs tests/connect-watering.test.mjs
      - name: Local dashboard browser regression
        run: |
          npm ci --ignore-scripts
          CHROME_PATH=/usr/bin/google-chrome node tests/platform/dashboard-local-smoke.cjs
          CHROME_PATH=/usr/bin/google-chrome node tests/platform/dashboard-shopping-browser.cjs
