name: Toolya release preview gate (no deployment)
on:
  push:
    branches: [release/toolya-website-prep]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-static-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build preview and block legacy production backend
        run: node scripts/build-release-preview.mjs
      - name: Check local assets and links
        run: node scripts/check-release-links.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser smoke on local preview
        run: node scripts/check-release-browser.mjs
      - name: Upload non-public preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toolya-release-preview
          path: .release-preview/
          retention-days: 2
