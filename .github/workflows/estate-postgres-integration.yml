name: Isolated estate PostgreSQL integration
on:
  push:
    branches:
      - feature/toolya-connect-phase-b
    paths:
      - 'tests/fixtures/estate-release-v2-*.sql'
      - 'supabase/migrations/*estate_release*.sql'
      - '.github/workflows/estate-postgres-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  estate-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated_fixture_only
          POSTGRES_DB: estate_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres -d estate_fixture'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_fixture_only
      PGDATABASE: estate_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply isolated schema and actual release RPC snapshot
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/estate-release-v2-isolated.sql
      - name: Execute PostgreSQL integration assertions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/estate-release-v2-assertions.sql
