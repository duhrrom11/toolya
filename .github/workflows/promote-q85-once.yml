name: Synchronize sprite PR with verified new main once
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: ['.github/workflows/promote-q85-once.yml']
permissions: {}
jobs:
  sync:
    if: github.repository == 'duhrrom11/toolya' && github.event.pull_request.number == 343 && github.event.pull_request.head.repo.full_name == 'duhrrom11/toolya' && github.head_ref == 'perf/mascot-sprite-q85-20261126' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Merge only the inspected main commit into the isolated PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = f31b1b4150485754c16a21c177c3aaef64521ca6
          test "$(git ls-remote origin refs/heads/perf/mascot-sprite-q85-20261126 | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(git diff --name-only 2a0cf3f59aa46007e1b3de4b7f7e1cb4c92a092f HEAD)" = .github/workflows/promote-q85-once.yml
          git -c user.name='Toolya CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-ff --no-edit f31b1b4150485754c16a21c177c3aaef64521ca6
          git diff --exit-code f31b1b4150485754c16a21c177c3aaef64521ca6 HEAD -- shared/toolya/platform.mjs shared/toolya/header.css tools/wishes/public.html
          git push origin HEAD:refs/heads/perf/mascot-sprite-q85-20261126
          echo "SYNCED_NEW_MAIN $(git rev-parse HEAD)"
