name: Toolya Connect isolated browser CI
on:
  push:
    branches: [main, feature/i18n-de-en-foundation-20261121]
    paths:
      - '.github/workflows/connect-playwright.yml'
      - 'tests/platform/connect-playwright.cjs'
      - 'tests/platform/connect-tool-integration.cjs'
      - 'tests/platform/connect-car-budget.cjs'
      - 'tests/platform/connect-expense-budget.cjs'
      - 'shared/toolya/connect-expense-budget.mjs'
      - 'supabase/migrations/20261120180200_toolya_connect_expense_sources.sql'
      - 'tests/fixtures/connect-postgres-isolated.sql'
      - 'shared/toolya/connect-car-budget.mjs'
      - 'supabase/migrations/20261117180000_toolya_connect_car_budget.sql'
      - 'tools/car/index.html'
      - 'tools/budget/index.html'
      - 'tools/moving/index.html'
      - 'tools/loans/index.html'
      - 'shared/toolya/cloud-controller.mjs'
      - 'shared/toolya/connect-panel.mjs'
      - 'shared/toolya/auth-page-gate.js'
      - 'index.html'
      - 'tools/wishes/index.html'
      - 'tools/plants/index.html'
      - 'tools/housemates/index.html'
      - 'tools/estate/index.html'
      - 'tools/pet-health/index.html'
      - 'tools/parking/index.html'
      - 'tools/meters/index.html'
      - 'tools/baking/index.html'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/connect-playwright.yml'
      - 'tests/platform/connect-playwright.cjs'
      - 'tests/platform/connect-tool-integration.cjs'
      - 'tests/platform/connect-car-budget.cjs'
      - 'tests/platform/connect-expense-budget.cjs'
      - 'shared/toolya/connect-expense-budget.mjs'
      - 'supabase/migrations/20261120180200_toolya_connect_expense_sources.sql'
      - 'shared/toolya/connect-car-budget.mjs'
      - 'supabase/migrations/20261117180000_toolya_connect_car_budget.sql'
      - 'tools/car/index.html'
      - 'tools/budget/index.html'
      - 'tools/moving/index.html'
      - 'tools/loans/index.html'
      - 'shared/toolya/cloud-controller.mjs'
      - 'shared/toolya/connect-panel.mjs'
      - 'shared/toolya/auth-page-gate.js'
      - 'index.html'
      - 'tools/wishes/index.html'
      - 'tools/plants/index.html'
      - 'tools/housemates/index.html'
      - 'tools/estate/index.html'
      - 'tools/pet-health/index.html'
      - 'tools/parking/index.html'
      - 'tools/meters/index.html'
      - 'tools/baking/index.html'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-connect-browser:
    name: Two-context Chromium / no production data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: CloudOnly tool integration contract
        run: node tests/platform/connect-tool-integration.cjs
      - name: Isolated PostgreSQL migration and security regression
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/fixtures/connect-postgres-isolated.sql
      - name: Car to budget isolated contract
        run: node tests/platform/connect-car-budget.cjs
      - name: Additional expense sources isolated UI contract
        run: node tests/platform/connect-expense-budget.cjs
      - name: Two-device browser regression (blocking)
        run: npm run test:connect:browser
