name: Toolya Amazon scraper
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'tools/wishes/**', 'amazon-wunschliste-veroeffentlichen/**', 'en/publish-amazon-wishlist/**', 'scripts/wishlist-fixed-links.cjs', 'shared/toolya/**', 'assets/**', 'tests/amazon/**', 'package*.json', '.github/workflows/amazon-scraper.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ['supabase/**', 'tools/wishes/**', 'amazon-wunschliste-veroeffentlichen/**', 'en/publish-amazon-wishlist/**', 'scripts/wishlist-fixed-links.cjs', 'shared/toolya/**', 'assets/**', 'tests/amazon/**', 'package*.json', '.github/workflows/amazon-scraper.yml']
  workflow_dispatch:
concurrency:
  group: amazon-scraper-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolated:
    timeout-minutes: 4
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test tests/amazon/*.test.mjs
      - run: node --check tools/wishes/amazon-import.mjs
      - run: node --check shared/toolya/platform.mjs
      - run: node --check shared/toolya/settings-unify.mjs
      - if: ${{ github.event_name != 'pull_request' || github.head_ref != 'release/toolya-english-1.0' || !github.event.pull_request.draft }}
        run: node tests/amazon/browser.cjs
      - if: ${{ github.event_name != 'pull_request' || github.head_ref != 'release/toolya-english-1.0' || !github.event.pull_request.draft }}
        run: node tests/amazon/release-acceptance.cjs
      - name: Exercise directory and card export in isolated Chromium
        env:
          TOOLYA_CHROMIUM_PATH: /usr/bin/google-chrome
        run: npx playwright test tests/browser/wishlist-directory.spec.cjs --reporter=line
      - run: node scripts/wishlist-fixed-links.cjs > wishlist-fixed-links.txt
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-retries 2 wishlist-fixed-links.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wishlist-mobile-acceptance
          path: test-results/*.png
          if-no-files-found: ignore
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {contents: read}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-fixture-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify captured Toolya visibility policies in disposable PostgreSQL
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 < tests/amazon/live-policy-schema.sql
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 < tests/amazon/privacy-rollback.sql
      - name: Verify public profile migration and owner permissions in isolated database
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres wishlist_profiles_test
          cat tests/amazon/public-profiles-bootstrap.sql supabase/migrations/20261117100000_public_wishlist_profiles.sql tests/amazon/public-profiles-assertions.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d wishlist_profiles_test -v ON_ERROR_STOP=1
      - name: Verify isolated admin discovery permissions, deduplication and public directory
        run: |
          cat tests/amazon/wishlist-discovery-bootstrap.sql supabase/migrations/20261117173000_wishlist_discovery.sql tests/amazon/wishlist-discovery-assertions.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d wishlist_profiles_test -v ON_ERROR_STOP=1
      - name: Verify preserved wishlist URLs, search, visibility and card ownership
        run: |
          cat supabase/migrations/20261118_wishlist_name_search_relevance.sql supabase/migrations/20261119161500_wishlist_profile_identity_fields.sql tests/amazon/directory-migration-bootstrap.sql supabase/migrations/20261128110000_wishlist_profiles_and_cards.sql tests/amazon/directory-migration-assertions.sql | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d wishlist_profiles_test -v ON_ERROR_STOP=1
