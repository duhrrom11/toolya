name: i18next migration pilot
on:
  push:
    branches:
      - feature/i18n-de-en-foundation-20261121
    paths:
      - 'shared/toolya/i18n/**'
      - 'tests/i18n/**'
      - 'tools/parking/index.html'
      - 'tools/moving/index.html'
      - 'tools/housemates/index.html'
      - 'tools/plants/index.html'
      - 'tools/baking/index.html'
      - 'tools/budget/index.html'
      - 'tools/meters/index.html'
      - 'tools/car/index.html'
      - 'tools/loans/index.html'
      - 'tools/pet-health/index.html'
      - '.github/workflows/i18next-pilot.yml'
  pull_request:
    paths:
      - 'shared/toolya/i18n/**'
      - 'tests/i18n/**'
      - 'tools/parking/index.html'
      - 'tools/moving/index.html'
      - 'tests/i18n/parking-i18next-playwright.cjs'
      - '.github/workflows/i18next-pilot.yml'
  workflow_dispatch:
concurrency:
  group: i18next-pilot-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate i18next syntax
        run: |
          node --check shared/toolya/i18n/i18next-legacy-resources.mjs
          node --check shared/toolya/i18n/i18next-runtime-adapter.mjs
          node --check shared/toolya/i18n/i18next-singleton.mjs
          node --check shared/toolya/i18n/tool-entry.mjs
      - name: Run focused migration regressions
        run: node --test tests/i18n/i18next-legacy-resources.test.mjs tests/i18n/i18next-runtime-adapter.test.mjs tests/i18n/i18next-singleton.test.mjs
  parking-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install real i18next browser bundle for offline tests
        run: npm install --no-save --package-lock=false i18next@23.16.8
      - run: npx playwright install --with-deps chromium
      - name: Verify parking language switching with and without i18next
        run: node tests/i18n/parking-i18next-playwright.cjs
