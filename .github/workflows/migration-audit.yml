name: Migration static audit
on:
  push:
    branches:
      - migration/english-paths-clean
  workflow_dispatch:
concurrency:
  group: migration-audit-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record browser and runner versions
        run: |
          echo "Runner: ${RUNNER_OS} ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          python3 --version
          node --version
          if command -v google-chrome >/dev/null; then google-chrome --version; elif command -v chromium >/dev/null; then chromium --version; else echo "Chromium missing"; exit 1; fi
          echo "CPU: $(nproc) available memory:"
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
      - name: Static dependency and route audit
        run: python3 scripts/audit_staging.py > migration-audit.json
      - name: Show audit summary
        if: always()
        run: |
          if [ -f migration-audit.json ]; then
            python3 -c 'import json;d=json.load(open("migration-audit.json"));print("Files:",d["scanned_files"],"References:",d["references_checked"],"Missing:",len(d["missing"]),"Legacy:",len(d["old_route_occurrences"]));print(json.dumps(d["missing"][:30],ensure_ascii=False,indent=2));print("Legacy routes:",json.dumps(d["old_route_occurrences"][:20],ensure_ascii=False))'
          fi
      - name: Verify wishes page DOM contracts offline
        run: python3 scripts/test_wishes_pages.py
      - name: Validate JS syntax
        if: always()
        run: |
          find staging -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check
          find staging -type f -name "*.mjs" -print0 | xargs -0 -r -n1 node --check
      - name: Headless Chrome local smoke tests
        if: always()
        run: python3 scripts/smoke_staging.py
      - name: Offline mock dependency browser diagnostics
        if: always()
        run: python3 scripts/smoke_mocked.py
      - name: Isolated wishes functional browser checks
        if: always()
        run: python3 scripts/test_wishes_browser.py
      - name: Isolated wishes mutation browser checks
        if: always()
        run: python3 scripts/test_wishes_mutations.py
      - name: Real localhost anchor navigation checks
        if: always()
        run: python3 scripts/smoke_navigation.py
      - name: Read-only UI controls smoke tests
        if: always()
        run: python3 scripts/smoke_ui.py
      - name: Verify rendered category filter results
        if: always()
        run: python3 scripts/smoke_results.py
      - name: Verify synthetic wishlist discovery search and sorting
        if: always()
        run: python3 scripts/smoke_discover_fixture.py
      - name: Verify synthetic moving inventory search tags and sorting
        if: always()
        run: python3 scripts/smoke_moving_fixture.py
      - name: Isolated encrypted backup import export and auth redirect assertions
        if: always()
        run: node scripts/test_backup_isolated.cjs
      - name: Isolated two-origin browser storage checks
        if: always()
        run: python3 scripts/test_two_origins.py
      - name: Actual encrypted backup transfer between isolated localhost origins
        if: always()
        run: python3 scripts/test_encrypted_two_origins.py
      - name: Offline cloud pending owner isolation checks
        if: always()
        run: node scripts/test_cloud_pending_isolated.cjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-static-audit
          path: migration-audit.json
          if-no-files-found: ignore
