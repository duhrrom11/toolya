name: Isolated Toolya browser tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/toolya-connect-phase-b
      - feature/i18n-de-en-foundation-20261121
    paths:
      - '.github/workflows/toolya-isolated-browser.yml'
      - 'tests/browser/**'
      - 'shared/toolya/**'
      - 'playwright.config.cjs'
      - 'scripts/home-preview.cjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  cloud-browser-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mock-only browser tests
        run: npx playwright test --config=playwright.config.cjs
