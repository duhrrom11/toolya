name: Toolya AI development foundation
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'docs/ai/**'
      - 'scripts/create-tool.cjs'
      - 'scripts/tool-builder.cjs'
      - 'scripts/preview-tool.cjs'
      - 'scripts/create-tool-from-brief.cjs'
      - 'scripts/build-tool-briefs.cjs'
      - 'shared/toolya/tool-builder/**'
      - 'tests/ai/**'
      - '.github/workflows/ai-development.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'docs/ai/**'
      - 'scripts/create-tool.cjs'
      - 'scripts/tool-builder.cjs'
      - 'scripts/preview-tool.cjs'
      - 'scripts/create-tool-from-brief.cjs'
      - 'scripts/build-tool-briefs.cjs'
      - 'shared/toolya/tool-builder/**'
      - 'tests/ai/**'
      - '.github/workflows/ai-development.yml'
permissions:
  contents: read
jobs:
  offline-scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scaffold syntax
        run: node --check scripts/create-tool.cjs
      - name: Validate tool builder and preview syntax
        run: |
          node --check scripts/tool-builder.cjs
          node --check scripts/preview-tool.cjs
          node --check scripts/create-tool-from-brief.cjs
          node --check scripts/build-tool-briefs.cjs
      - name: Run isolated AI development tests
        run: npm run test:ai
      - name: Install browser test dependency without scripts
        run: npm ci --ignore-scripts
      - name: Verify shared mascot header and footer in isolated Chromium
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/ai/tool-generator.browser.cjs
          node tests/ai/tool-builder.browser.cjs
      - name: Verify CLI dry run cannot publish or create files
        run: |
          npm run tools:scaffold -- --slug ci-draft --title 'CI Draft' --description 'Synthetic local-only CI check.' --dry-run
          test ! -e tools/ci-draft
      - name: Convert ChatGPT briefs into offline preview artifacts
        run: |
          npm run tools:from-brief -- --spec docs/ai/briefs/ai-prozentrechner-entwurf.json --validate-only --json
          npm run tools:from-brief -- --spec docs/ai/briefs/ai-prozentrechner-entwurf.json --dry-run --json
          npm run tools:build-briefs
          test ! -e tools/ai-prozentrechner-entwurf
          test -f test-results/ai-brief-artifacts/report.json
      - name: Upload review-only tool brief previews
        uses: actions/upload-artifact@v4
        with:
          name: toolya-ai-brief-previews
          path: test-results/ai-brief-artifacts/
          retention-days: 7
          if-no-files-found: error
