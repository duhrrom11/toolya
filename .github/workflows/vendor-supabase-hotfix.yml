name: Stage pinned Supabase browser SDK
on:
  push:
    branches: [fix/wishlist-sdk-20261126]
    paths: ['.github/workflows/vendor-supabase-hotfix.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wishlist-sdk-20261126
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official pinned package without lifecycle scripts
        run: |
          set -eu
          tmp=$(mktemp -d)
          npm pack @supabase/supabase-js@2.119.2 --ignore-scripts --registry=https://registry.npmjs.org --pack-destination "$tmp"
          tar -xzf "$tmp/supabase-supabase-js-2.119.2.tgz" -C "$tmp" package/package.json package/dist/umd/supabase.js
          node -e 'const p=require(process.argv[1]);if(p.name!=="@supabase/supabase-js"||p.version!=="2.119.2")process.exit(1)' "$tmp/package/package.json"
          cp "$tmp/package/dist/umd/supabase.js" assets/vendor/supabase-2.119.2.js
          node --check assets/vendor/supabase-2.119.2.js
          sha256sum assets/vendor/supabase-2.119.2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/supabase-2.119.2.js
          git commit -m 'vendor: official Supabase browser SDK 2.119.2'
          git push origin HEAD:fix/wishlist-sdk-20261126
